# 这是来源登记模板，不是已验证的生产 URL。
# 填写前需人工确认域名归属、栏目、robots/公开接口规则和最近一次抓取结果。

policy:
  keyword_policy: gov_recruitment_jiangsu_v1
  default_check_interval_sec: 21600
  school_check_interval_sec: 86400
  max_response_bytes: 20971520
  allowed_content_types: [text/html, application/pdf, application/vnd.ms-excel,
                          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]

institution_registry:
  # 用户提供的白名单是公办属性的权威来源；系统不自行推断学校性质。
  # 每所学校可在 sources 中登记人事处、组织部或通知公告多个栏目。
  whitelist_file: "<用户提供的白名单文件>"
  whitelist_batch_id: "<导入时生成>"
  ownership_required: public
  school_level_allowed: [junior_college, vocational]
  cities: [南京, 无锡, 徐州, 常州, 苏州, 南通, 连云港, 淮安, 盐城, 扬州, 镇江, 泰州, 宿迁]

sources:
  - id: js_province_hrss
    source_group: jiangsu_province_hrss
    region: 江苏
    source_level: official
    publisher: 江苏省人力资源和社会保障部门
    entry_url: "https://jshrss.jiangsu.gov.cn/col/col93343/index.html"
    discovery_type: html_list
    adapter: generic_html_v1
    max_pages: 3

  - id: js_province_recruitment
    source_group: jiangsu_province_recruitment
    region: 江苏
    source_level: official
    publisher: 江苏省事业单位招聘官方入口
    entry_url: "https://rs.jshrss.jiangsu.gov.cn/index/"
    discovery_type: html_list
    adapter: generic_html_v1

